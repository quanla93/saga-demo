server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/saga?currentSchema=inventory_db
    username: saga
    password: saga
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: inventory_db
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    default-schema: inventory_db
    schemas: inventory_db
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true

saga:
  outbox:
    poll-interval-ms: 500

logging:
  level:
    com.quanla.sagademo: DEBUG
