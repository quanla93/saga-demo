server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/saga?currentSchema=order_db
    username: saga
    password: saga
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: order_db
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    default-schema: order_db
    schemas: order_db
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: ${spring.application.name}

saga:
  outbox:
    poll-interval-ms: 500
    batch-size: 50
  # Stuck-saga detector: any non-terminal saga whose updated_at is older than
  # timeout-seconds will be forced forward (FAILED or COMPENSATING) by
  # SagaTimeoutScanner on its next scan tick.
  timeout-seconds: 120
  timeout-scan-seconds: 30

logging:
  level:
    com.quanla.sagademo: DEBUG
    org.hibernate.SQL: WARN