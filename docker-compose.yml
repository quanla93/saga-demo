# Full-stack compose: infra (postgres / kafka / redis / kafdrop) + the 4
# Spring Boot services. All overridable knobs live in .env (see .env.example).
#
# Hardware budget: tuned to fit ~2 CPU cores and ~2 GB RAM total (homelab).
# - mem_limit is set per container to fit the 2 GB budget (totals ~1.95 GB).
# - CPU is NOT capped per container — cap the TOTAL at the Docker daemon
#   level (Docker Desktop: Settings -> Resources -> CPUs = 2). Per-container
#   cpus caps would prevent services from bursting when neighbours are idle,
#   which on a 2-core host strangles throughput unnecessarily.
#
# To run on bigger hardware, just bump or delete the mem_limit lines.
#
# Usage:
#   docker compose up -d                       # everything
#   docker compose up -d postgres kafka redis kafdrop   # infra only (run apps locally)
#   docker compose logs -f order-service       # tail one service
#   docker compose down -v                     # stop + wipe Postgres volume

services:
  # ===== Infrastructure =====
  postgres:
    image: postgres:16-alpine
    container_name: saga-postgres
    command: >
      postgres
      -c shared_buffers=48MB
      -c work_mem=4MB
      -c max_connections=60
      -c effective_cache_size=96MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga}
      POSTGRES_DB: ${POSTGRES_DB:-saga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saga} -d ${POSTGRES_DB:-saga}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 144m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: saga-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx96M -Xms96M"
    mem_limit: 160m

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: saga-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx192M -Xms192M"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 352m

  redis:
    image: redis:7-alpine
    container_name: saga-redis
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 48m

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: saga-kafdrop
    depends_on:
      - kafka
    ports:
      - "${KAFDROP_PORT:-9000}:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms64M -Xmx80M"
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: saga-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: saga-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ===== Application services =====
  # JAVA_OPTS_* env vars set explicit heap so the JVM does not auto-tune
  # against the container's mem_limit and pick a too-small heap. Headroom
  # between heap and mem_limit covers metaspace + threads + Netty native + GC.

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: order-service
    container_name: saga-order
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "${ORDER_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saga}?currentSchema=order_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-saga}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-saga}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SAGA_OUTBOX_POLL_INTERVAL_MS: ${SAGA_OUTBOX_POLL_MS:-500}
      SAGA_TIMEOUT_SECONDS: ${SAGA_TIMEOUT_SECONDS:-120}
      JAVA_OPTS: ${ORDER_JAVA_OPTS:--Xmx144m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=100}
    mem_limit: 304m
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: payment-service
    container_name: saga-payment
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "${PAYMENT_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saga}?currentSchema=payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-saga}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-saga}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SAGA_PAYMENT_FAIL_ABOVE_AMOUNT: ${PAYMENT_FAIL_ABOVE:-5000}
      JAVA_OPTS: ${PAYMENT_JAVA_OPTS:--Xmx112m -XX:MaxMetaspaceSize=112m -XX:+UseG1GC -XX:MaxGCPauseMillis=100}
    mem_limit: 256m
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: inventory-service
    container_name: saga-inventory
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "${INVENTORY_PORT:-8083}:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saga}?currentSchema=inventory_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-saga}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-saga}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SAGA_INVENTORY_STOCK_SOURCE: ${STOCK_SOURCE:-REDIS}
      SAGA_INVENTORY_SALE_WINDOWS: ${SALE_WINDOWS:-}
      SAGA_OUTBOX_POLL_INTERVAL_MS: ${SAGA_OUTBOX_POLL_MS:-500}
      JAVA_OPTS: ${INVENTORY_JAVA_OPTS:--Xmx144m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=100}
    mem_limit: 304m
    restart: unless-stopped

  ui-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ui-service
    container_name: saga-ui
    depends_on:
      kafka:             { condition: service_healthy }
      order-service:     { condition: service_started }
      inventory-service: { condition: service_started }
    ports:
      - "${UI_PORT:-8080}:8080"
    environment:
      SAGA_ORDER_SERVICE_URL: http://order-service:8081
      SAGA_INVENTORY_SERVICE_URL: http://inventory-service:8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: ${UI_JAVA_OPTS:--Xmx128m -XX:MaxMetaspaceSize=112m -XX:+UseG1GC -XX:MaxGCPauseMillis=100}
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
