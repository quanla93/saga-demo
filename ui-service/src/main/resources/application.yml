server:
  port: 8080

spring:
  application:
    name: ui-service
  thymeleaf:
    cache: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Random group ID per startup so every restart reads from offset 0 and
      # rebuilds the full saga trace from history. Trade-off: we re-process
      # every message every start. Fine for a demo with thousands of orders.
      group-id: ui-service-trace-${random.uuid}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: ${spring.application.name}

saga:
  order-service-url: http://localhost:8081
  inventory-service-url: http://localhost:8083

logging:
  level:
    com.quanla.sagademo: DEBUG
