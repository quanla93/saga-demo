<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Saga Demo Dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1, h2 { color: #1f2937; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; font-size: 0.9rem; }
    th { background: #f3f4f6; }
    .status-CONFIRMED { color: #047857; font-weight: 600; }
    .status-CANCELLED { color: #b91c1c; font-weight: 600; }
    .status-PENDING { color: #b45309; font-weight: 600; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; max-width: 600px; background: #f9fafb; padding: 1rem; border-radius: 8px; }
    form label { font-size: 0.85rem; color: #374151; }
    form input, form select { padding: 0.4rem; border: 1px solid #d1d5db; border-radius: 4px; font-family: inherit; }
    form button { grid-column: 1 / -1; padding: 0.6rem; background: #2563eb; color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    form button:hover { background: #1d4ed8; }
    a { color: #2563eb; }
  </style>
</head>
<body>

<h1>Saga Orchestration Demo</h1>
<p>order-service drives the saga. inventory-service and payment-service are participants. Outbox/Inbox patterns + idempotency keys make the messaging exactly-once-effective.</p>

<h2>Create order</h2>
<form th:action="@{/orders}" method="post" th:object="${form}">
  <label>Customer ID (blank = random)
    <input type="text" th:field="*{customerId}" placeholder="auto" />
  </label>
  <label>Product
    <select th:field="*{productId}" required>
      <option th:each="p : ${products}" th:value="${p.id}"
              th:text="|${p.sku} — ${p.name} (avail ${p.stockAvailable})|"></option>
    </select>
  </label>
  <label>Quantity
    <input type="number" th:field="*{quantity}" value="1" min="1" required />
  </label>
  <label>Unit price (try &gt; 5000 to force payment failure)
    <input type="number" step="0.01" th:field="*{unitPrice}" value="100.00" required />
  </label>
  <button type="submit">Place order</button>
</form>

<h2>Products</h2>
<table>
  <thead><tr><th>SKU</th><th>Name</th><th>Available</th><th>Reserved</th></tr></thead>
  <tbody>
    <tr th:each="p : ${products}">
      <td th:text="${p.sku}"></td>
      <td th:text="${p.name}"></td>
      <td th:text="${p.stockAvailable}"></td>
      <td th:text="${p.stockReserved}"></td>
    </tr>
  </tbody>
</table>

<h2>Orders</h2>
<table>
  <thead><tr><th>Order</th><th>Status</th><th>Saga state</th><th>Total</th><th>Created</th></tr></thead>
  <tbody>
    <tr th:each="o : ${orders}">
      <td><a th:href="@{|/orders/${o.orderId}|}" th:text="${#strings.substring(o.orderId, 0, 8)}"></a></td>
      <td th:text="${o.status}" th:classappend="|status-${o.status}|"></td>
      <td th:text="${o.sagaState}"></td>
      <td th:text="${o.totalAmount}"></td>
      <td th:text="${o.createdAt}"></td>
    </tr>
  </tbody>
</table>

</body>
</html>
